[colors]
background     = #2E3440
background-alt = #3B4252
foreground     = #D8DEE9
polar-night0   = #2E3440
polar-night1   = #3B4252
polar-night2   = #434C5E
polar-night3   = #4C566A
frost0         = #8FBCBB
frost1         = #88C0D0
frost2         = #81A1C1
frost3         = #5E81AC
red            = #5E81AC
orange         = #81A1C1
yellow         = #88C0D0
green          = #8FBCBB
pink           = #B48EAD

;  ____
; | __ )  __ _ _ __
; |  _ \ / _` | '__|
; | |_) | (_| | |
; |____/ \__,_|_|
;

[bar/bar1]
width          = 100%
height         = 3%
;radius        = 10
;dpi           = 96
fixed-center   = true

background     = ${colors.background}
foreground     = ${colors.foreground}

line-size      = 3pt

;border-size   = 3pt
border-color   = #00000000

padding-left   = 1
padding-right  = 1

module-margin  = 1

font-0         = JetBrainsMonoNerdFont;2

modules-left   = menu xworkspaces xwindow
modules-center = date
modules-right  = systray pulseaudio cpu memory filesystem battery0 battery1

cursor-click   = pointer
cursor-scroll  = ns-resize

enable-ipc     = true

;separator = |
;separator-foreground = ${colors.foreground}

;  ____       _   _   _
; / ___|  ___| |_| |_(_)_ __   __ _ ___
; \___ \ / _ \ __| __| | '_ \ / _` / __|
;  ___) |  __/ |_| |_| | | | | (_| \__ \
; |____/ \___|\__|\__|_|_| |_|\__, |___/
;                             |___/

[settings]
screenchange-reload = true
pseudo-transparency = true

;  __  __           _       _
; |  \/  | ___   __| |_   _| | ___  ___
; | |\/| |/ _ \ / _` | | | | |/ _ \/ __|
; | |  | | (_) | (_| | |_| | |  __/\__ \
; |_|  |_|\___/ \__,_|\__,_|_|\___||___/
;

[module/menu]
type                          = custom/text

format                        = 
format-foreground             = ${colors.frost2}
format-padding                = 1

click-left                    = rofi -show run
click-right                   = rofi -show power-menu -modi power-menu:~/.config/rofi/powermenu

[module/xworkspaces]
type = internal/xworkspaces

label-active                  = %name%
label-active-background       = ${colors.background-alt}
label-active-underline        = ${colors.frost3}
label-active-padding          = 1

label-occupied                = %name%
label-occupied-padding        = 1

label-urgent                  = %name%
label-urgent-background       = ${colors.background-alt}
label-urgent-padding          = 1

label-empty                   = %name%
label-empty-foreground        = ${colors.foreground}
label-empty-padding           = 1

[module/xwindow]
type                          = internal/xwindow
label                         = %title:0:60:...%

[module/date]
type                          = internal/date
interval                      = 1

date                          = %h %d.%m.%Y %H:%M
date-alt                      = %A, %h %d.%m.%Y %H:%M:%S

label                         = %date%
label-foreground              = ${colors.foreground}

[module/systray]
type                          = internal/tray

format-margin                 = 8pt
tray-spacing                  = 16pt

[module/pulseaudio]
type                          = internal/pulseaudio

use-ui-max                    = false

interval                      = 10

format-volume-foreground      = ${colors.red}
format-volume                 = <ramp-volume> <label-volume>

label-volume                  = %percentage%%

ramp-volume-0                 = 
ramp-volume-1                 = 
ramp-volume-2                 = 

label-muted                   = 󰝟 muted
label-muted-foreground        = ${colors.red}

click-right                   = pavucontrol

[module/memory]
type                          = internal/memory
interval                      = 2
format-foreground             = ${colors.yellow}
label                         =  %gb_used%

[module/battery0]
type                          = internal/battery

full-at                       = 99
low-at                        = 5

battery                       = BAT0
adapter                       = ADP1

poll-interval                 = 5
time-format                   = %H:%M

label-charging                = 󱟠 %percentage%% - %time%h
label-discharging             = 󱟞 %percentage%% - %time%h
label-full                    = 󰂄 Full
label-low                     = 󰂃 LOW - %time%h

format-charging-foreground    = ${colors.frost3}
format-discharging-foreground = ${colors.frost3}
format-full-foreground        = ${colors.frost3}
